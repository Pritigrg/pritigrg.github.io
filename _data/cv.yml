        start_date: 2015
        end_date: 2019

    Experience:
      - company: Howard University
        position: Research Assistant
        location: Washington, DC
        start_date: 2024
        end_date: Present
        highlights:
          - Investigate limitations of vision-only models for physical and material understanding, including predictive object attributes such as fragile versus non-fragile, soft versus rigid.
          - Study how physical understanding improves robust decision-making in manipulation and interaction tasks.
          - Explore dataset-driven approaches, including touch-vision-language data, for multimodal alignment.
          - Developed LOOM, a lightweight training-free method for refining person re-identification features at inference time without retraining or changing model architectures.
          - Identified limitations in existing person re-identification approaches, including identity mixing and added computational cost, and designed a more stable and efficient alternative.

      - company: Howard University
        position: Teaching Assistant
        location: Washington, DC
        start_date: 2024
        end_date: Present
        highlights:
          - Supported Structure of Programming Languages, Intro to Computer Science (III), Applied Data Science, Theory of Computation, Computer Organization (I), and Introduction to AI.

      - company: Cedar Gate Technologies
        position: Data Business Analyst
        location: Greenwich, CT
        start_date: 2022
        end_date: 2023

    Publications:
      - title: Risk Profiling using LLM and Few-shot Prompting Technique
        date: 2024
        publisher: NeurIPS Women in Machine Learning Workshop
        summary: Accepted poster presentation. Proposed an automated system for risk assessment using LLMs and prompt engineering with a 0 to 10 scoring framework for financial stability, cybersecurity, and reputation management.

      - title: LOOM - Rethinking Feature Refinement for Person Re-Identification
        date: 2025
        publisher: Under submission
        summary: Developed a plug-and-play, training-free feature enhancement method based on leave-one-out mean centering, with identity-aware and cluster-aware variants for supervised and label-free settings.

      - title: Extended TVL Dataset for Material Classification
        date: 2025
        publisher: Ongoing
        summary: Extended a touch-vision-language dataset with material annotations, built a tactile-only encoder-based classifier, and investigated agreement between LLM-generated and human-provided labels.

      - title: Getting the Right Attention - Body-Part Aware Prompting for Person Re-Identification
        date: 2025
        publisher: AWS Machine Learning University AI/ML Student Poster Session
        summary: Accepted poster session. Proposed body-part-aware prompting to guide vision-language models toward stronger localization and more robust person re-identification.

      - title: Towards Neuro-Symbolic Reinforcement Learning for Trustworthy Human-Autonomy Teaming
        date: 2024
        publisher: Assurance and Security for AI-enabled Systems, SPIE
        summary: Oral presentation on neuro-symbolic reinforcement learning for trustworthy human-autonomy teaming.

