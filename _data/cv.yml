cv:
  name: Priti Gurung
  label: Ph.D. Candidate in Computer Science
  email: priti.gurung.phd@gmail.com
  location: Washington, DC
  image: ""
  summary: Computer Science Ph.D. candidate specializing in computer vision and multimodal AI. My research focuses on improving vision-language and touch-vision-language models for physical world understanding, efficient feature refinement, and trustworthy AI systems.

  sections:
