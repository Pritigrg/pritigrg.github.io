    Projects:
      - name: LOOM Feature Refinement
        summary: Training-free feature refinement for person re-identification that improves representation quality without retraining base models.
        highlights:
          - Developed identity-aware and cluster-aware LOOM variants.
          - Reduced intra-class variance while improving feature separability.

      - name: Extended TVL Dataset
        summary: Multimodal material classification project centered on touch-vision-language data and physical world understanding.
        highlights:
          - Added material-type annotations to the TVL dataset.
          - Built a tactile-only encoder-based classifier and studied label agreement between LLMs and humans.

      - name: Body-Part Aware Prompting
        summary: Prompting strategy for vision-language person re-identification that improves attention localization and robustness.
        highlights:
          - Proposed body-part-aware prompts to guide model focus.
          - Presented at the AWS Machine Learning University AI/ML Student Poster Session.

      - name: Risk Profiling with LLMs
        summary: Automated multimodal risk assessment pipeline using large language models and few-shot prompting.
        highlights:
          - Designed a 0 to 10 scoring framework.
          - Targeted financial stability, cybersecurity, and reputation management use cases.

